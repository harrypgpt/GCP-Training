# Local development infrastructure.
#   docker compose -f infra/docker-compose.yml up -d
#
# Values come from the repo-root .env (copy from .env.example). This stack is
# for local development only and must never be used as-is in production.

name: gcp-training

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gcp_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-gcp_training}
      # Deterministic init; avoids locale surprises for citext comparisons.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gcp} -d ${POSTGRES_DB:-gcp_training}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
